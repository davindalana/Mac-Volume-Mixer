name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Compile & Package Application
        run: |
          chmod +x bundle_app.sh
          ./bundle_app.sh

      - name: Create Release Zip & DMG
        run: |
          chmod +x create_dmg.sh
          ./create_dmg.sh
          ditto -c -k --keepParent /Applications/MacVolumeMixer.app ./dist/MacVolumeMixer-${{ github.ref_name }}.zip
          shasum -a 256 dist/* > checksum.txt
          cat checksum.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MacVolumeMixer ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: |
            dist/*
            checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

